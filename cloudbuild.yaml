steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agente-luis:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agente-luis:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agente-luis:$COMMIT_SHA'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agente-luis:latest'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agente-luis'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agente-luis:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=anthropic-api-key:latest'
      - '--set-env-vars'
      - 'PORT=3000,CLAUDE_MODEL=claude-3-5-sonnet-20241022'

images:
  - 'gcr.io/$PROJECT_ID/agente-luis:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agente-luis:latest'
